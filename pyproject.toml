[project]
name = "calendar-sync"
version = "0.1.0"
description = "Copy busy times from outside calendars onto a Google calendar as private blocks."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [
    { name = "Joey Parrish", email = "joey.parrish@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-kms>=3.18.0",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
