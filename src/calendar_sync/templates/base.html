<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Sync App</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  .note { background: #fff4d6; padding: .5rem .75rem; border-radius: 4px; }
  .muted { color: #666; font-size: .9rem; }
  form.inline { display: inline; }
  fieldset { border: 1px solid #ddd; border-radius: 4px; margin: 1rem 0; }
  label { display: block; margin: .3rem 0; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid #eee; vertical-align: top; }
</style>
</head>
<body>
<h1>Calendar Sync App</h1>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}<p class="note">{{ m }}</p>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
<script>
  // Slow actions wait on Google; show that the click registered and prevent a second one.
  document.addEventListener("submit", (event) => {
    const button = event.target.querySelector("button[data-busy]");
    if (button) {
      button.disabled = true;
      button.textContent = button.dataset.busy;
    }
  });
</script>
</body>
</html>
